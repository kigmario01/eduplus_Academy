name: CI - EduPlus Academy

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  backend-stack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Instalar herramientas necesarias
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl netcat-openbsd

      - name: Detectar comando docker compose
        id: compose
        run: |
          if docker compose version >/dev/null 2>&1; then
            echo "cmd=docker compose" >> $GITHUB_OUTPUT
          else
            echo "cmd=docker-compose" >> $GITHUB_OUTPUT
          fi

      - name: Crear .env si no existe
        run: |
          if [ ! -f ".env" ]; then
            cp .env.example .env
          fi

      - name: Construir imágenes Docker para CI
        run: |
          ${{ steps.compose.outputs.cmd }} -f docker-compose.ci.yml build \
            postgres auth-service course-service evaluation-service

      - name: Levantar stack de servicios en CI
        run: |
          ${{ steps.compose.outputs.cmd }} -f docker-compose.ci.yml up -d \
            postgres auth-service course-service evaluation-service

      - name: Esperar que servicios expongan sus puertos
        run: |
          echo "Esperando puertos..."
          for i in {1..30}; do
            nc -z localhost 5555 && \
            nc -z localhost 4000 && \
            nc -z localhost 3001 && \
            nc -z localhost 5005 && break
            echo "Aún no... intento $i/30"
            sleep 3
          done

      - name: Instalar dependencias y ejecutar unit tests
        run: |
          npm ci
          npm run test:unit

      - name: Capturar logs Docker (si falla)
        if: failure()
        run: |
          mkdir -p logs
          docker ps -a > logs/containers.txt
          for svc in postgres auth-service course-service evaluation-service; do
            docker logs $svc > logs/$svc.log 2>&1 || echo "No logs" > logs/$svc.log
          done

      - name: Subir artifacts de logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: logs/

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Instalar dependencias de frontend
        working-directory: frontend
        run: npm ci || npm install

      - name: Build de frontend
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:5003/api
          VITE_COURSE_SERVICE_URL: http://localhost:5003/api
          VITE_AUTH_SERVICE_URL: http://localhost:4000/api/auth
          VITE_EVALUATION_SERVICE_URL: http://localhost:5005/api/evaluations
        run: npm run build
