# Continuous Integration: build y verificación básica de servicios
# - Ejecuta build del frontend
# - Construye y levanta stack Docker para microservicios
# - Realiza health checks HTTP mínimos

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  backend-stack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar utilidades
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Detectar comando docker compose
        id: compose
        run: |
          if docker compose version >/dev/null 2>&1; then
            echo "cmd=docker compose" >> $GITHUB_OUTPUT
          else
            echo "cmd=docker-compose" >> $GITHUB_OUTPUT
          fi

      - name: Crear .env desde .env.example si falta
        run: |
          if [ ! -f ".env" ]; then
            cp .env.example .env
          fi

      - name: Disable healthchecks in CI
        run: |
          cp docker-compose.yml docker-compose.ci.yml
          sed -i 's/healthcheck:/# healthcheck:/g' docker-compose.ci.yml

      - name: Construir imágenes Docker con Compose
        run: |
          ${{ steps.compose.outputs.cmd }} build auth-service course-service evaluation-service

      - name: Levantar stack de servicios
        run: |
          ${{ steps.compose.outputs.cmd }} -f docker-compose.ci.yml up -d postgres auth-service course-service evaluation-service

      - name: Esperar endpoints saludables
        run: |
          echo "Esperando health endpoints..."
          for i in {1..40}; do
            auth_code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4000/health || true)
            course_code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/health || true)
            eval_code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5005/api/evaluations/health || true)
            if [ "$auth_code" = "200" ] && [ "$course_code" = "200" ] && [ "$eval_code" = "200" ]; then
              echo "Servicios con health OK"
              exit 0
            fi
            echo "Aún no... intento $i/40 (auth=$auth_code course=$course_code eval=$eval_code)"
            sleep 3
          done
          ${{ steps.compose.outputs.cmd }} -f docker-compose.ci.yml ps
          echo "Tiempo de espera agotado"
          exit 1

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar dependencias de frontend
        working-directory: frontend
        run: npm ci || npm install

      - name: Build de frontend
        working-directory: frontend
        run: npm run build