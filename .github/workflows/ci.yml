# Continuous Integration: build y verificación básica de servicios
# - Ejecuta build del frontend
# - Construye y levanta stack Docker para microservicios
# - Realiza health checks HTTP mínimos

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-stack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar utilidades
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Crear .env desde .env.example si falta
        run: |
          if [ ! -f ".env" ]; then
            cp .env.example .env
          fi

      - name: Construir imágenes Docker con Compose
        run: |
          docker compose build auth-service course-service evaluation-service

      - name: Levantar stack de servicios
        run: |
          docker compose up -d postgres auth-service course-service evaluation-service

      - name: Esperar servicios saludables
        run: |
          echo "Esperando que los servicios estén arriba..."
          for i in {1..40}; do
            HEALTHY=$(docker compose ps --format json | jq -r '.[].State.Health.Status' | grep healthy | wc -l)
            if [ "$HEALTHY" -ge 4 ]; then
              echo "Todos saludables"
              exit 0
            fi
            echo "Aún no... intento $i/40"
            sleep 3
          done
          docker compose ps
          echo "Tiempo de espera agotado"
          exit 1

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar dependencias de frontend
        working-directory: frontend
        run: npm ci || npm install

      - name: Build de frontend
        working-directory: frontend
        run: npm run build