name: Build and Push Docker Images

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAMESPACE: ${{ github.repository_owner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./eduplus/frontend
          file: ./eduplus/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/eduplus-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/eduplus-frontend:${{ github.sha }}
          build-args: |
            VITE_API_URL=https://your-backend-domain-or-host:4000

      - name: Build and push auth-service
        uses: docker/build-push-action@v5
        with:
          context: ./eduplus/services/auth-service
          file: ./eduplus/services/auth-service/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/eduplus-auth-service:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/eduplus-auth-service:${{ github.sha }}