name: Deploy EduPlus Academy # DESPLIEGUE CONTINUO

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
      schedule:
    - cron: "0 15 * * 5"

jobs:

  #====================================================================
  # 1. BUILD + TEST (Antes de cualquier despliegue)
  #====================================================================
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: npm

      - name: Instalar utilidades
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Detectar comando docker compose
        id: compose
        run: |
          if docker compose version >/dev/null 2>&1; then
            echo "cmd=docker compose" >> $GITHUB_OUTPUT
          else
            echo "cmd=docker-compose" >> $GITHUB_OUTPUT
          fi

      - name: Preparar .env
        run: |
          if [ ! -f ".env" ]; then
            cp .env.example .env
          fi
          
      - name: Crear archivo .env para CI
        run: |
          echo "NODE_ENV=test" > .env
          echo "JWT_SECRET=test-secret" >> .env
          echo "DATABASE_URL=postgres://postgres:postgres@postgres:5432/eduplus_test" >> .env
          echo "POSTGRES_USER=postgres" >> .env
          echo "POSTGRES_PASSWORD=postgres" >> .env
          echo "POSTGRES_DB=eduplus_test" >> .env

      - name: Desactivar healthcheck para CI
        run: |
          cp docker-compose.yml docker-compose.ci.yml
          sed -i 's/healthcheck:/# healthcheck:/g' docker-compose.ci.yml

      - name: Construir imágenes
        run: |
          ${{ steps.compose.outputs.cmd }} build auth-service course-service evaluation-service

      - name: Levantar servicios
        run: |
          ${{ steps.compose.outputs.cmd }} -f docker-compose.ci.yml up -d postgres auth-service course-service evaluation-service

      - name: Esperar health endpoints
        run: |
          echo "Esperando health endpoints..."
          for i in {1..40}; do
            auth_code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4000/health || true)
            course_code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/health || true)
            eval_code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5005/api/evaluations/health || true)
            if [ "$auth_code" = "200" ] && [ "$course_code" = "200" ] && [ "$eval_code" = "200" ]; then
              echo "Servicios con health OK"
              break
            fi
            echo "Aún no... intento $i/40 (auth=$auth_code course=$course_code eval=$eval_code)"
            sleep 3
          done

      - name: Install Root Dependencies
        run: npm ci

      - name: Run Integration Tests
        run: npm run test:integration

      - name: Logs en fallo
        if: failure()
        run: |
          ${{ steps.compose.outputs.cmd }} -f docker-compose.ci.yml ps
          ${{ steps.compose.outputs.cmd }} -f docker-compose.ci.yml logs --tail=200

      - name: Confirm Tests Passed
        run: echo "Todo correcto. Tests superados ✔"

  #====================================================================
  # 2. DEPLOY FRONTEND A VERCEL
  #====================================================================
  deploy-frontend:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: ${{ secrets.VERCEL_TOKEN != '' }}

    steps:
      - uses: actions/checkout@v3

      - name: Install Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Generate Build Info
        run: |
          cd frontend
          mkdir -p public
          cat > public/build-info.json << EOF
          {
            "version": "1.0.0",
            "commitSha": "${{ github.sha }}",
            "commitMessage": "${{ github.event.head_commit.message }}",
            "buildDate": "$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)",
            "branch": "${{ github.ref_name }}",
            "buildNumber": "${{ github.run_number }}",
            "repository": "${{ github.repository }}",
            "actor": "${{ github.actor }}"
          }
          EOF

      - name: Build Frontend
        run: |
          cd frontend
          npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Deploy Frontend to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_FRONTEND }}
          working-directory: ./frontend
          vercel-args: '--prod --prebuilt'

  #====================================================================
  # 3. DEPLOY AUTH SERVICE (VERCEL)
  #====================================================================
  deploy-auth-service:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: ${{ secrets.VERCEL_PROJECT_ID_AUTH != '' }}

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Auth Dependencies
        run: |
          cd services/auth-service
          npm ci

      - name: Deploy Auth-Service to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_AUTH }}
          working-directory: ./services/auth-service
          vercel-args: '--prod'
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          PORT: ${{ secrets.AUTH_SERVICE_PORT }}

  #====================================================================
  # 4. DEPLOY COURSE SERVICE (RENDER)
  #====================================================================
  deploy-course-service:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: ${{ secrets.RENDER_API_KEY != '' && secrets.RENDER_SERVICE_ID_COURSE != '' }}

    steps:
      - uses: actions/checkout@v3

      - name: Deploy Course-Service to Render
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID_COURSE }}
          api-key: ${{ secrets.RENDER_API_KEY }}
          wait-for-success: true
