name: Deploy EduPlus Academy

on: 
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
# on:
#   schedule:
#     # Runs every Friday at 15:00 UTC (3 PM)
#     - cron: '0 15 * * 5'
#   workflow_dispatch: # Allows manual trigger for testing
# NO ESTÁ ACTIVO 
jobs:
  build-and-deploy-frontend:
    if: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID_FRONTEND != '' }}
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
        
      - name: Generate Build Info
        run: |
          cd frontend
          mkdir -p public
          cat > public/build-info.json << EOF
          {
            "version": "1.0.0",
            "commitSha": "${{ github.sha }}",
            "commitMessage": "${{ github.event.head_commit.message }}",
            "buildDate": "$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)",
            "branch": "${{ github.ref_name }}",
            "buildNumber": "${{ github.run_number }}",
            "repository": "${{ github.repository }}",
            "actor": "${{ github.actor }}"
          }
          EOF
          echo "Build info generated:"
          cat public/build-info.json

      - name: Build
        run: |
          cd frontend
          npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
      
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_FRONTEND }}
          working-directory: ./frontend
          vercel-args: '--prod --prebuilt'

  deploy-auth-service:
    if: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID_AUTH != '' }}
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './services/auth-service/package-lock.json'
      
      - name: Install dependencies
        run: |
          cd services/auth-service
          npm ci
      
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_AUTH }}
          working-directory: ./services/auth-service
          vercel-args: '--prod'
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          PORT: ${{ secrets.AUTH_SERVICE_PORT }}

  deploy-course-service:
    if: ${{ secrets.RENDER_API_KEY != '' && secrets.RENDER_SERVICE_ID_COURSE != '' }}
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Deploy to Render
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID_COURSE }}
          api-key: ${{ secrets.RENDER_API_KEY }}
          wait-for-success: true