version: "3.9"

services:
  mongo:
    image: mongo:6.0
    container_name: eduplus-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: eduplus-auth
    environment:
      - PORT=4000
      - DATABASE_URL=postgresql://test_user:test_pass_2024@host.docker.internal:5433/eduplus_test?sslmode=disable
      - JWT_SECRET=supersecret_change_me
      - NODE_ENV=development
    depends_on:
      - postgres-test
    ports:
      - "4000:4000"

  postgres-test:
    image: postgres:15-alpine
    container_name: eduplus-postgres-test
    environment:
      - POSTGRES_DB=eduplus_test
      - POSTGRES_USER=test_user
      - POSTGRES_PASSWORD=test_pass_2024
      - POSTGRES_INITDB_ARGS=--auth-host=md5
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ./database/init-test.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./database/test-data.sql:/docker-entrypoint-initdb.d/02-test-data.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d eduplus_test"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:4000
    container_name: eduplus-frontend
    depends_on:
      - auth-service
    ports:
      - "8080:80"

volumes:
  mongo_data:
  postgres_test_data: