version: "3.9"

services:
  mongo:
    image: mongo:6.0
    container_name: eduplus-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: eduplus-auth
    environment:
      - PORT=4000
      - MONGO_URI=mongodb://mongo:27017/eduplus
      - JWT_SECRET=supersecret_change_me
    depends_on:
      - mongo
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:4000
    container_name: eduplus-frontend
    depends_on:
      - auth-service
    ports:
      - "8080:80"

volumes:
  mongo_data: