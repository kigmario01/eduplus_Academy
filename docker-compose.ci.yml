services:
  postgres:
    image: postgres:15
    container_name: eduplus-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=eduplus
    ports:
      - "5555:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # healthcheck: disabled in CI
    # test: ["CMD-SHELL", "pg_isready -U postgres"]
    # interval: 10s
    # timeout: 5s
    # retries: 5

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: eduplus-auth
    env_file:
      - .env
      - .env.example
    environment:
      - PORT=${PORT:-4000}
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/eduplus
      - JWT_SECRET=test-secret
    depends_on:
      - postgres
    ports:
      - "4000:4000"
    # healthcheck: disabled in CI
    # test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
    # interval: 10s
    # timeout: 5s
    # retries: 10

  course-service:
    build:
      context: ./services/course-service
      dockerfile: Dockerfile
    container_name: eduplus-course
    env_file:
      - .env
      - .env.example
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/eduplus
    depends_on:
      - postgres
    ports:
      - "5003:3001"
    # healthcheck: disabled in CI
    # test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
    # interval: 10s
    # timeout: 5s
    # retries: 10

  evaluation-service:
    build:
      context: ./services/evaluation-service
      dockerfile: Dockerfile
    container_name: eduplus-evaluation
    env_file:
      - .env
      - .env.example
    environment:
      - PORT=5005
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/eduplus
      - JWT_SECRET=test-secret
    depends_on:
      - postgres
      - auth-service
      - course-service
    ports:
      - "5005:5005"
    # healthcheck: disabled in CI
    # test: ["CMD", "curl", "-f", "http://localhost:5005/api/evaluations/health"]
    # interval: 10s
    # timeout: 5s
    # retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "http://localhost:5003/api"
        VITE_COURSE_SERVICE_URL: "http://localhost:5003/api"
        VITE_AUTH_SERVICE_URL: "http://localhost:4000/api/auth"
        VITE_EVALUATION_SERVICE_URL: "http://localhost:5005/api/evaluations"
    container_name: eduplus-front
    depends_on:
      - auth-service
      - course-service
      - evaluation-service
    ports:
      - "8080:80"

volumes:
  pgdata:
